name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: acoustic-shell-linux-x86_64
            binary: acoustic-shell

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: acoustic-shell-windows-x86_64
            binary: acoustic-shell.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: acoustic-shell-macos-arm64
            binary: acoustic-shell

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: acoustic-shell-macos-x86_64
            binary: acoustic-shell

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ALSA dev headers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
